[package]
name = "perry-storekit"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "StoreKit 2 in-app purchase bindings for Perry apps (iOS / macOS). Closes PerryTS/perry#537."
repository = "https://github.com/PerryTS/storekit"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# perry-ffi is pinned to the Perry release the package is tested with:
# `main` moves ahead of released compilers (and needs nightly since
# 0.6.0), and its ABI has to match the Perry that links the app.
perry-ffi = { git = "https://github.com/PerryTS/perry", tag = "v0.5.1664" }
